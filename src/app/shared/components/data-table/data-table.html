
<div class="table-container">
  @if (loading) {
    <p class="loading-message">Loading data...</p>
  } @else if (rows.length > 0) {
    <table>
      <thead>
        <tr>
          @for (column of columns; track column.key) {
            <th>{{ column.label }}</th>
          }
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        @for (row of rows; track $index) {
          <tr>
            @for (column of columns; track column.key) {
              <td>{{ getCellValue(row, column.key) }}</td>
            }

            <td class="actions">
              <button type="button" (click)="viewRow.emit(row)">
                View
              </button>

              <button type="button" (click)="editRow.emit(row)">
                Edit
              </button>

              <button type="button" (click)="deleteRow.emit(row)">
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <p class="empty-message">{{ emptyMessage }}</p>
  }
</div>
